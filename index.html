<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>タイマー</title>
  <style>
:root{
  --bg:#0f1724;
  --card:#0b1220;
  --accent:#06b6d4;
  --text:#e6eef6;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
  background:linear-gradient(180deg,var(--bg),#071022);
  color:var(--text);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
h1{margin:0 0 12px 0;font-size:20px}
.display{
  font-variant-numeric: tabular-nums;
  font-size:48px;
  text-align:center;
  padding:18px 10px;
  background:rgba(255,255,255,0.02);
  border-radius:8px;
  margin-bottom:12px;
}

.display.countdown{
  color:#ff4d4f;
  font-weight:800;
  font-size:64px;
}
.controls{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
button{
  padding:10px 14px;border-radius:8px;border:0;background:var(--card);color:var(--text);cursor:pointer;font-weight:600
}
button:disabled{opacity:0.45;cursor:not-allowed}
.laps{max-height:220px;overflow:auto;background:transparent;padding:8px;border-radius:8px}
.laps h2{margin:6px 0;font-size:14px}
ol#laps{margin:0;padding-left:18px}
.hint{font-size:13px;color:rgba(230,238,246,0.7);text-align:center;margin-top:12px}

@media (max-width:420px){
  .display{font-size:36px}
}
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: black !important;
      background-image: none !important;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }
    
    .container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      width: 100%;
      height: 100vh;
      padding: 20px;
      box-sizing: border-box;
      background: black !important;
      background-image: none !important;
    }
    
    h1 {
      font-size: 32px;
      margin-bottom: 40px;
      color: white;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
    
    #display {
      font-size: clamp(80px, min(30vw, 25vh), 250px);
      font-weight: bold;
      font-family: 'Courier New', monospace;
      color: #fff;
      text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.4);
      margin: 20px 0;
      line-height: 1;
      letter-spacing: 2px;
    }
    
    .controls {
      display: flex;
      gap: 15px;
      margin: 30px 0;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
    }
    
    button {
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      background: white;
      color: #667eea;
    }
    
    button:hover:not(:disabled) {
      background: #f0f0f0;
      transform: scale(1.05);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }
    
    button:active:not(:disabled) {
      transform: scale(0.98);
    }
    
    button:disabled {
      background: rgba(255, 255, 255, 0.5);
      cursor: not-allowed;
      opacity: 0.6;
    }
    
    .adjust-btn {
      font-size: 28px;
      padding: 12px 20px;
      min-width: 60px;
    }
    
    .time-label {
      font-size: 24px;
      font-weight: bold;
      color: white;
      min-width: 100px;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }
    
    .hint {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.8);
      margin-top: 40px;
      text-align: center;
      line-height: 1.6;
    }
  </style>
  </head>
<body>
  <div class="container">
    <div id="display" class="display">00:00</div>
    <div class="controls">
      <button id="decrement" class="adjust-btn">−</button>
      <span id="timeLabel" class="time-label">0分</span>
      <button id="increment" class="adjust-btn">+</button>
    </div>
    <div class="controls">
      <button id="startStop">Start/Stop</button>
      <button id="reset" disabled>Reset</button>
    </div>
	<div>
		<input class="preCount" type="checkbox" name="preCount" id="preCount" checked> 事前カウント
	</div>
  </div>
  <script>
  (function(){
    const display = document.getElementById('display');
    const timeLabel = document.getElementById('timeLabel');
    const startStopBtn = document.getElementById('startStop');
    const resetBtn = document.getElementById('reset');
    const incrementBtn = document.getElementById('increment');
    const decrementBtn = document.getElementById('decrement');
	const preCountCheckbox = document.getElementById('preCount');

    if (!display || !timeLabel || !startStopBtn) return;

    let totalSeconds = 0;
    let remainingSeconds = 0;
    let isRunning = false;
    let timerInterval = null;
    let audioCtx = null;
    let countdownStarted = false;
    let timerStartTime = 0;
    let elapsedBeforeRun = 0;
    let runStartedAt = 0;
    let stopEnabledTimeout = null;
    let countdownTimeouts = [];
    let isCountUpMode = false;

    function ensureAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume().catch(() => {});
      }
    }

    function beep(freq, durationMs, volume = 0.12) {
      if (!audioCtx) return;
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(volume, now);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + durationMs / 1000);
    }

    function updateDisplay() {
      const mins = Math.floor(remainingSeconds / 60);
      const secs = remainingSeconds % 60;
      display.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    function updateTimeLabel() {
      const minutes = Math.floor(totalSeconds / 60);
      timeLabel.textContent = minutes + '分';
    }

    function setTime(minutes) {
      if (isRunning) return;
      totalSeconds = minutes * 60;
      remainingSeconds = totalSeconds;
      isCountUpMode = (totalSeconds === 0);  // Set count-up mode if 0
      updateDisplay();
      updateTimeLabel();
    }

    function scheduleCountdown(callback, delay) {
      const timeout = setTimeout(() => {
        countdownTimeouts = countdownTimeouts.filter(id => id !== timeout);
        callback();
      }, delay);
      countdownTimeouts.push(timeout);
    }

    function startCountdown() {
      if (totalSeconds === 0 && !isCountUpMode) return;
      if (isRunning) return;

      if (!countdownStarted) {
        // First click: do 3-2-1 countdown with sounds
        countdownStarted = true;
        ensureAudio();
        incrementBtn.disabled = true;
        decrementBtn.disabled = true;
        resetBtn.disabled = true;
        startStopBtn.disabled = true;

        let n = 3;
        display.textContent = String(n);

        if (preCountCheckbox.checked) {
          (function tick(count) {
            if (count > 0) {
              display.textContent = String(count);
              try { beep(1000, 120); } catch (e) {}
              scheduleCountdown(() => tick(count - 1), 1000);
            } else {
              try { beep(1800, 520, 0.14); } catch (e) {}
              scheduleCountdown(() => {
                remainingSeconds = totalSeconds;
                updateDisplay();
                startTimerNow();
              }, 250);
            }
          })(3);
        } else {
          remainingSeconds = totalSeconds;
          updateDisplay();
          startTimerNow();
        }
      } else {
        startTimerNow();
      }
    }

    function updateTimer() {
      const elapsedSeconds = Math.floor(
        (elapsedBeforeRun + Date.now() - timerStartTime) / 1000
      );

      if (isCountUpMode) {
        remainingSeconds = elapsedSeconds;
      } else {
        remainingSeconds = Math.max(0, totalSeconds - elapsedSeconds);
      }

      updateDisplay();

      if (!isCountUpMode && remainingSeconds <= 0) {
        isCountUpMode = true;
        display.style.color = 'red';
        elapsedBeforeRun = 0;
        timerStartTime = Date.now();
        remainingSeconds = 0;
        updateDisplay();
        try {
          beep(800, 300, 0.2);
          setTimeout(() => beep(800, 300, 0.2), 350);
          setTimeout(() => beep(800, 600, 0.25), 700);
        } catch (e) {}
      }
    }

    function startTimerNow() {
      isRunning = true;
      startStopBtn.textContent = 'Stop';
      startStopBtn.disabled = true;
      resetBtn.disabled = true;
      incrementBtn.disabled = true;
      decrementBtn.disabled = true;
      timerStartTime = Date.now();
      runStartedAt = timerStartTime;
      timerInterval = setInterval(updateTimer, 100);
      stopEnabledTimeout = setTimeout(() => {
        stopEnabledTimeout = null;
        if (isRunning) startStopBtn.disabled = false;
      }, 2000);
    }

    function stopTimer() {
      if (!isRunning || Date.now() - runStartedAt < 2000) return;
      updateTimer();
      elapsedBeforeRun += Date.now() - timerStartTime;
      clearInterval(timerInterval);
      timerInterval = null;
      if (stopEnabledTimeout !== null) {
        clearTimeout(stopEnabledTimeout);
        stopEnabledTimeout = null;
      }
      isRunning = false;
      startStopBtn.textContent = 'Start/Stop';
      startStopBtn.disabled = false;
      resetBtn.disabled = false;
    }

    function resetTimer() {
      if (timerInterval !== null) {
        clearInterval(timerInterval);
        timerInterval = null;
      }
      if (stopEnabledTimeout !== null) {
        clearTimeout(stopEnabledTimeout);
        stopEnabledTimeout = null;
      }
      countdownTimeouts.forEach(clearTimeout);
      countdownTimeouts = [];
      isRunning = false;
      countdownStarted = false;
      elapsedBeforeRun = 0;
      startStopBtn.textContent = 'Start/Stop';
      startStopBtn.disabled = false;
      incrementBtn.disabled = false;
      decrementBtn.disabled = false;
      resetBtn.disabled = true;
      display.style.color = 'white';
      remainingSeconds = totalSeconds;
      updateDisplay();
      updateTimeLabel();
    }

    function toggleTimer() {
      if (isRunning) {
        stopTimer();
      } else if (!countdownStarted || elapsedBeforeRun > 0) {
        startCountdown();
      }
    }

    startStopBtn.addEventListener('click', toggleTimer);
    resetBtn.addEventListener('click', resetTimer);

    incrementBtn.addEventListener('click', function() {
      if (!isRunning) {
        const minutes = Math.floor(totalSeconds / 60);
        setTime(minutes + 1);
      }
    });

    decrementBtn.addEventListener('click', function() {
      if (!isRunning) {
        const minutes = Math.floor(totalSeconds / 60);
        if (minutes > 0) {
          setTime(minutes - 1);
        }
      }
    });

    // Keyboard shortcuts
    document.addEventListener('keydown', function(e) {
      if (e.code === 'Space' && !e.repeat) {
        const target = e.target;
        if (target instanceof HTMLElement &&
            (target.isContentEditable || target.matches('button, input, select, textarea'))) {
          return;
        }
        e.preventDefault();
        toggleTimer();
      } else if (e.code === 'KeyR') {
        e.preventDefault();
        resetTimer();
      }
    });

    // Initialize
    setTime(1);
  })();
  </script>
</body>
</html>
